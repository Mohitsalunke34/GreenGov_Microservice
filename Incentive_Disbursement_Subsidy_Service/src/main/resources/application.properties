spring.application.name=Incentive_Subsidy_Distribution_Service


server.port = 7070
 
#database connection properties
#spring.datasource.url=jdbc:mysql://localhost:3306/Incentive_disbursemebt_db?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=mysql
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.config.import=optional:configserver:http://localhost:8711
 
#hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


#Eureka client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.instance.preferIpAddress=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka